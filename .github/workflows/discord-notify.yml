name: Discord Notify

# Posts pull request, issue, and release updates to the Discord webhook in the
# DISCORD_WEBHOOK_URL secret. .github/scripts/discord-notify.cjs decides what
# to post and what to skip.
#
# pull_request_target runs with secrets on fork PRs. That is safe here only
# because no step checks out or runs PR code. The checkout below fetches the
# base branch's .github/scripts, and the script reads the event payload.

on:
  pull_request_target:
    types: [opened, ready_for_review, closed]
  issues:
    types: [opened, closed]
  release:
    types: [published]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    if: github.repository == 'chrisbenincasa/tunarr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const { notify } = require('./.github/scripts/discord-notify.cjs');
            await notify({ github, context, core });

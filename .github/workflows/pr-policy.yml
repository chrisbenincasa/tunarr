name: PR Policy

# Enforces the contribution policy in docs/dev/contributing.md.
#
# pull_request_target runs with a write token on fork PRs. That is safe here
# only because no step checks out or runs PR code. The checkout below fetches
# the base branch's .github/scripts, and the script reads the PR via the API.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to re-check. Leave empty to run the expiry sweep instead.
        type: number
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  # A `/recheck` comment counts only from the PR author or someone with write
  # access. The filter lives here so other comments never start a run that
  # cancels one in progress.
  check:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/recheck') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
          github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-latest
    concurrency:
      group: pr-policy-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPullRequest } = require('./.github/scripts/pr-policy.cjs');
            await checkPullRequest({ github, context, core });

  recheck:
    if: github.event_name == 'issues' && github.event.label.name == 'design approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { recheckLinkedPullRequests } = require('./.github/scripts/pr-policy.cjs');
            await recheckLinkedPullRequests({ github, context, core });

  close-expired:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.pr_number)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { closeExpired } = require('./.github/scripts/pr-policy.cjs');
            await closeExpired({ github, context, core });

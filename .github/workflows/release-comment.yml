name: Release Comments

# Comments on the pull requests and issues that shipped in a stable release.
# Prereleases are skipped.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag, e.g. v2026.9.0"
        required: true
        type: string
      dry_run:
        description: "List the targets without posting"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  comment:
    name: Comment on released items
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Comment
        env:
          # GITHUB_TOKEN, not RELEASE_PLEASE_TOKEN. That PAT cannot comment;
          # every semantic-release comment on v1.3.15 failed with it.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: bash .github/scripts/release-comment.sh "${TAG}"

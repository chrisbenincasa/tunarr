packages:
  - server
  - web
  - types
  - shared
  - e2e

catalog:
  dayjs: ^1.11.20
  lodash-es: ^4.17.21
  random-js: 2.1.0
  typescript: "7.0.2"
  zod: ^4.5.4

catalogs:
  vitest:
    "@vitest/coverage-v8": ^4.1.5
    vitest: ^4.1.5

enablePrePostScripts: true

# Corepack manages the pnpm version through `packageManager`. Ignoring it here
# keeps pnpm from writing a boot document into pnpm-lock.yaml, which GitHub's
# dependency graph and Dependabot cannot read.
pmOnFail: ignore

# Reject package versions published less than a day ago. Setting this
# explicitly makes pnpm fail instead of falling back to an older version.
# To take a same-day release (for example, a security fix), add the package
# to `minimumReleaseAgeExclude` for that change.
minimumReleaseAge: 1440

patchedDependencies:
  kysely: "patches/kysely.patch"

overrides:
  conventional-changelog-conventionalcommits: "^9.0.0"
  "@types/node": "22.10.7"

allowBuilds:
  "@swc/core": true
  arktype: true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  oxlint: true
